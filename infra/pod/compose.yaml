version: "3.9"

services:
  nginx:
    image: docker.io/nginx:alpine
    container_name: cambot-nginx
    ports:
      - "${CAM_BOT_HTTP_PORT:-8080}:80"
      - "${CAM_BOT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # Frontend static files.
      - ../../apps/client:/usr/share/nginx/html:ro

      # TLS certs.
      - ../../secrets/${ENVIRONMENT:-dev}/tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ../../secrets/${ENVIRONMENT:-dev}/tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro

      # Basic auth.
      - ../../secrets/${ENVIRONMENT:-dev}/podman/nginx.htpasswd:/etc/nginx/.htpasswd:ro

    depends_on:
      - rest-api
      - camera-system-mocker-rest-api
    restart: unless-stopped

  rest-api:
    build:
      context: ../../apps/server/RestApi
      dockerfile: Containerfile
    container_name: cambot-rest-api
    env_file:
      - ../../secrets/${ENVIRONMENT:-dev}/podman/.env
    environment:
      DATABASE_URL: postgresql://cambot:cambot@postgres:5432/cambot
      CAMERA_SYSTEM_BASE_URL: http://camera-system-mocker-rest-api:8080
    depends_on:
      - postgres
    restart: unless-stopped

  gemini-caller:
    build:
      context: ../../apps/server/GeminiCaller
      dockerfile: Containerfile
    container_name: cambot-gemini-caller
    env_file:
      - ../../secrets/${ENVIRONMENT:-dev}/podman/.env
    environment:
      CAM_BOT_DEFAULT_GEMINI_MODE=fake
      CAM_BOT_DEFAULT_GEMINI_API_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
      CAM_BOT_DEFAULT_GEMINI_API_KEY=AIzaSyBiW1fMVsLunuXmThGkQz9lzzkbd5uarRU
      CAM_BOT_DEFAULT_GEMINI_API_KEY_QUERY_PARAM=key
      CAM_BOT_DEFAULT_GEMINI_API_TIMEOUT_SECONDS=60
      CAM_BOT_DEFAULT_GEMINI_USE_RESPONSE_SCHEMA=true
      CAM_BOT_DEFAULT_BACKGROUND_WORKER_INTERVAL_S=5
    depends_on:
      - rest-api
      - camera-system-mocker-rest-api
      - postgres
    restart: unless-stopped

  camera-system-mocker-rest-api:
    build:
      context: ../../apps/server/CameraSystemMockerRestApi
      dockerfile: Containerfile
    container_name: cambot-camera-system-mocker-rest-api
    env_file:
      - ../../secrets/${ENVIRONMENT:-dev}/podman/.env
    environment:
      CAMERA_MOCKER_DATA_ROOT: /data/camera-mocker
      CAMERA_MOCKER_CONFIG: /data/camera-mocker/defaultCameras.json
      CAMERA_MOCKER_PUBLIC_BASE_PATH: /camera-system
      CAMERA_MOCKER_CAMERA_N_COUNT: "20"
    volumes:
      - ../../secrets/${ENVIRONMENT:-dev}/camera-mocker:/data/camera-mocker:ro
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:16
    container_name: cambot-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cambot}"
      POSTGRES_USER: "${POSTGRES_USER:-cambot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cambot}"
    volumes:
      - cambot-postgres-data:/var/lib/postgresql/data
      # Init SQL runs only when /var/lib/postgresql/data is empty/new.
      - ../../apps/contracts/postgres/schema/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro,Z
      - ../../apps/contracts/postgres/seed/dev.sql:/docker-entrypoint-initdb.d/002_dev_seed.sql:ro,Z
    restart: unless-stopped

volumes:
  cambot-postgres-data:
