server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # Public browser runtime config.
    location = /config/env.js {
        auth_basic off;
        default_type application/javascript;
        try_files /config/env.js =404;
    }

    # Protected CamBot REST API.
    location /api/ {
        auth_basic "CamBot API";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://rest-api:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected camera system integrator API.
    location /camera-system/ {
        auth_basic "CamBot Camera System";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://camera-system-mocker-rest-api:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public frontend app: index.html, JS, CSS, assets, SPA routes.
    location / {
        auth_basic off;
        try_files $uri $uri/ /index.html;
    }
}
