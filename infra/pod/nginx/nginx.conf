limit_req_zone $binary_remote_addr zone=public_read_per_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_write_per_ip:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Basic Auth protects the live CamBot demo.
    # The actual username/password comes from /etc/nginx/.htpasswd,
    # which should be generated from NGINX_USER_NAME and NGINX_PWD
    # by podman-run-dev.sh or the deployment script.
    auth_basic "CamBot Live Demo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Static frontend
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RestApi health check
    location = /api/health {
        limit_req zone=public_read_per_ip burst=30 nodelay;

        proxy_pass http://rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Operator action queue read endpoint
    location = /api/operator-actions {
        limit_req zone=public_read_per_ip burst=30 nodelay;

        proxy_pass http://rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Operator action update endpoint
    location ~ ^/api/operator-actions/.+ {
        limit_req zone=api_write_per_ip burst=10 nodelay;

        proxy_pass http://rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Demo/system stats
    location = /api/stats {
        limit_req zone=public_read_per_ip burst=30 nodelay;

        proxy_pass http://rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Mock camera system health
    location = /cam/health {
        limit_req zone=public_read_per_ip burst=30 nodelay;

        proxy_pass http://camera-system-mocker-rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Mock camera list
    location = /cam/cameras {
        limit_req zone=public_read_per_ip burst=30 nodelay;

        proxy_pass http://camera-system-mocker-rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Individual mock camera record
    location ~ ^/cam/cameras/[^/]+$ {
        limit_req zone=public_read_per_ip burst=30 nodelay;

        proxy_pass http://camera-system-mocker-rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Mock camera snapshot images
    location ~ ^/cam/cameras/[^/]+/snapshot\.jpg$ {
        limit_req zone=public_read_per_ip burst=60 nodelay;

        proxy_pass http://camera-system-mocker-rest-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
