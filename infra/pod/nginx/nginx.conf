server {
    listen 80;
    server_name _;

    # Basic auth can protect the demo.
    # Remove these two lines if you do not want auth.
    auth_basic "CamBot";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Frontend static files.
    root /usr/share/nginx/html;
    index index.html;

    # Runtime frontend config:
    # /config/env.js comes from secrets/<env>/client/env.js.
    location = /config/env.js {
        default_type application/javascript;
        try_files /config/env.js =404;
    }

    # CamBot REST API.
    location /api/ {
        proxy_pass http://rest-api:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Camera System Integrator API.
    # For the hackathon, the mocker implements this contract.
    location /camera-system/ {
        proxy_pass http://camera-system-mocker-rest-api:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
