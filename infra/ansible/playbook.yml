---
- name: Configure CamBot application files and start pod
  hosts: all
  become: true

  vars:
    cambot_user: cambot
    cambot_root: /srv/cambot
    cambot_environment: "{{ lookup('env', 'ENVIRONMENT') | default('dev', true) }}"
    local_project_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Install required application packages
      community.general.pacman:
        name:
          - podman
          - podman-compose
          - python
          - python-pip
          - rsync
          - git
          - openssl
          - slirp4netns
          - fuse-overlayfs
          - apache
        state: present
        update_cache: true

    - name: Create cambot user
      ansible.builtin.user:
        name: "{{ cambot_user }}"
        shell: /bin/bash
        create_home: true

    - name: Create CamBot root
      ansible.builtin.file:
        path: "{{ cambot_root }}"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0755"

    - name: Enable linger for cambot user
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - "{{ cambot_user }}"
      changed_when: false
      failed_when: false

    - name: Copy project files, excluding local/private artifacts
      ansible.builtin.synchronize:
        src: "{{ local_project_root }}/"
        dest: "{{ cambot_root }}/"
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=secrets"
          - "--exclude=generated"
          - "--exclude=generated_dtos"
          - "--exclude=build"
          - "--exclude=node_modules"
          - "--exclude=__pycache__"
          - "--exclude=infra/terraform/.terraform"
          - "--exclude=infra/terraform/terraform.tfstate"
          - "--exclude=infra/terraform/terraform.tfstate.backup"
          - "--exclude=apps/client/config/env.js"

    - name: Ensure CamBot root ownership after sync
      ansible.builtin.file:
        path: "{{ cambot_root }}"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        recurse: true

    - name: Ensure frontend config directory exists and is writable by cambot
      ansible.builtin.file:
        path: "{{ cambot_root }}/apps/client/config"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0755"

    - name: Create remote runtime secret directories
      ansible.builtin.file:
        path: "{{ cambot_root }}/secrets/{{ cambot_environment }}/{{ item }}"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0750"
      loop:
        - client
        - tls
        - podman
        - camera-mocker

    - name: Ensure nginx auth directory is readable by container
      ansible.builtin.file:
        path: "{{ cambot_root }}/secrets/{{ cambot_environment }}/podman"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0755"

    - name: Push frontend runtime config env.js
      ansible.builtin.copy:
        src: "{{ local_project_root }}/secrets/{{ cambot_environment }}/client/env.js"
        dest: "{{ cambot_root }}/secrets/{{ cambot_environment }}/client/env.js"
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0640"

    - name: Push TLS certificate chain
      ansible.builtin.copy:
        src: "{{ local_project_root }}/secrets/{{ cambot_environment }}/tls/fullchain.pem"
        dest: "{{ cambot_root }}/secrets/{{ cambot_environment }}/tls/fullchain.pem"
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0640"

    - name: Push TLS private key
      ansible.builtin.copy:
        src: "{{ local_project_root }}/secrets/{{ cambot_environment }}/tls/privkey.pem"
        dest: "{{ cambot_root }}/secrets/{{ cambot_environment }}/tls/privkey.pem"
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0600"

    - name: Push pod runtime env file
      ansible.builtin.copy:
        src: "{{ local_project_root }}/secrets/{{ cambot_environment }}/podman/.env"
        dest: "{{ cambot_root }}/secrets/{{ cambot_environment }}/podman/.env"
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0640"

    - name: Push nginx htpasswd file if it exists locally
      ansible.builtin.copy:
        src: "{{ local_project_root }}/secrets/{{ cambot_environment }}/podman/nginx.htpasswd"
        dest: "{{ cambot_root }}/secrets/{{ cambot_environment }}/podman/nginx.htpasswd"
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0644"
      failed_when: false

    - name: Push camera mocker dataset
      ansible.builtin.synchronize:
        src: "{{ local_project_root }}/secrets/{{ cambot_environment }}/camera-mocker/"
        dest: "{{ cambot_root }}/secrets/{{ cambot_environment }}/camera-mocker/"
        delete: true
        rsync_opts:
          - "--exclude=tmp"
          - "--exclude=*.tmp"
          - "--exclude=.DS_Store"
          - "--exclude=__pycache__"
          - "--chmod=D750,F640"

    - name: Ensure camera mocker dataset ownership
      ansible.builtin.file:
        path: "{{ cambot_root }}/secrets/{{ cambot_environment }}/camera-mocker"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        recurse: true

    - name: Ensure secrets root is restricted
      ansible.builtin.file:
        path: "{{ cambot_root }}/secrets"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0750"

    - name: Ensure environment secrets directory is restricted
      ansible.builtin.file:
        path: "{{ cambot_root }}/secrets/{{ cambot_environment }}"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0750"

    - name: Get cambot user uid
      ansible.builtin.command:
        cmd: "id -u {{ cambot_user }}"
      register: cambot_user_uid
      changed_when: false

    - name: Start CamBot pod through wrapper
      ansible.builtin.command:
        cmd: ./podman-run.sh
        chdir: "{{ cambot_root }}/infra/pod"
      become: true
      become_user: "{{ cambot_user }}"
      environment:
        ENVIRONMENT: "{{ cambot_environment }}"
        CAM_BOT_BASE_DIR: "{{ cambot_root }}"
        XDG_RUNTIME_DIR: "/run/user/{{ cambot_user_uid.stdout }}"

    - name: Show running CamBot containers
      ansible.builtin.command:
        cmd: podman ps
      become: true
      become_user: "{{ cambot_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cambot_user_uid.stdout }}"
      register: cambot_podman_ps
      changed_when: false

    - name: Print running containers
      ansible.builtin.debug:
        var: cambot_podman_ps.stdout_lines
