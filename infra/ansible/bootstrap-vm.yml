---
- name: Bootstrap CamBot VM
  hosts: all
  become: true
  gather_facts: true

  vars:
    admin_user: "{{ lookup('env', 'CAM_BOT_REMOTE_ADMIN_USER') | default('admin', true) }}"
    cambot_user: "{{ lookup('env', 'CAM_BOT_SERVICE_USER') | default('cambot', true) }}"
    cambot_root: "{{ lookup('env', 'CAM_BOT_REMOTE_DIR') | default('/srv/cambot', true) }}"
    ssh_public_key_path: "{{ lookup('env', 'SSH_PUBLIC_KEY_PATH') }}"
    github_deploy_public_key_path: "{{ lookup('env', 'GITHUB_DEPLOY_PUBLIC_KEY_PATH') | default('', true) }}"

    public_iface: "{{ ansible_default_ipv4.interface | default('eth0') }}"

  pre_tasks:
    - name: Ensure SSH public key path is provided
      ansible.builtin.assert:
        that:
          - ssh_public_key_path is defined
          - ssh_public_key_path | length > 0
        fail_msg: "SSH_PUBLIC_KEY_PATH must be provided by provision-vm.sh."

  tasks:
    - name: Update pacman package cache
      community.general.pacman:
        update_cache: true

    - name: Install required packages
      community.general.pacman:
        name:
          - openssh
          - podman
          - podman-compose
          - ufw
          - sudo
          - rsync
          - git
          - python
          - python-pip
          - apache
          - shadow
          - slirp4netns
          - fuse-overlayfs
          - iptables
          - nftables
        state: present

    - name: Ensure sshd is enabled and running
      ansible.builtin.service:
        name: sshd
        state: started
        enabled: true

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups:
          - wheel
        append: true
        create_home: true

    - name: Create cambot service user
      ansible.builtin.user:
        name: "{{ cambot_user }}"
        shell: /bin/bash
        create_home: true

    - name: Add local/provisioning SSH key to admin
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', ssh_public_key_path) }}"
        state: present

    - name: Check for GitHub Actions deploy public key
      ansible.builtin.stat:
        path: "{{ github_deploy_public_key_path }}"
      register: github_deploy_public_key_stat
      delegate_to: localhost
      become: false
      when:
        - github_deploy_public_key_path is defined
        - github_deploy_public_key_path | length > 0

    - name: Add GitHub Actions deploy SSH key to admin
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', github_deploy_public_key_path) }}"
        state: present
      when:
        - github_deploy_public_key_path is defined
        - github_deploy_public_key_path | length > 0
        - github_deploy_public_key_stat.stat.exists | default(false)

    - name: Allow wheel sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-wheel-nopasswd
        content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"

    - name: Create CamBot root directory
      ansible.builtin.file:
        path: "{{ cambot_root }}"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0755"

    - name: Enable linger for cambot rootless services
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - "{{ cambot_user }}"
      register: enable_linger_result
      changed_when: >-
        'Created symlink' in (enable_linger_result.stdout | default('')) or
        'Created symlink' in (enable_linger_result.stderr | default(''))
      failed_when: false

    - name: Configure rootless podman config directory for cambot
      ansible.builtin.file:
        path: "/home/{{ cambot_user }}/.config/containers"
        state: directory
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0755"

    - name: Write cambot rootless podman storage config
      ansible.builtin.copy:
        dest: "/home/{{ cambot_user }}/.config/containers/storage.conf"
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0644"
        content: |
          [storage]
          driver = "overlay"

          [storage.options.overlay]
          mount_program = "/usr/bin/fuse-overlayfs"

    - name: Write cambot rootless podman network config
      ansible.builtin.copy:
        dest: "/home/{{ cambot_user }}/.config/containers/containers.conf"
        owner: "{{ cambot_user }}"
        group: "{{ cambot_user }}"
        mode: "0644"
        content: |
          [network]
          default_rootless_network_cmd = "slirp4netns"

    - name: Enable IPv4 forwarding for UFW redirects
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-cambot-forwarding.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward=1

    - name: Apply sysctl settings
      ansible.builtin.command:
        argv:
          - sysctl
          - --system
      changed_when: false

    - name: Ensure UFW default forward policy allows redirected traffic
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: "^DEFAULT_FORWARD_POLICY="
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

    - name: Reset UFW to clean state
      community.general.ufw:
        state: reset

    - name: Set UFW default deny incoming
      community.general.ufw:
        policy: deny
        direction: incoming

    - name: Set UFW default allow outgoing
      community.general.ufw:
        policy: allow
        direction: outgoing

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow public HTTP through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow public HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow rootless Podman HTTP host port through UFW
      community.general.ufw:
        rule: allow
        port: "8080"
        proto: tcp

    - name: Allow rootless Podman HTTPS host port through UFW
      community.general.ufw:
        rule: allow
        port: "8443"
        proto: tcp

    - name: Add CamBot NAT redirects to UFW before.rules
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        insertbefore: "^\\*filter"
        marker: "# {mark} CAMBOT NAT REDIRECTS"
        block: |
          *nat
          :PREROUTING ACCEPT [0:0]
          -A PREROUTING -i {{ public_iface }} -p tcp --dport 80 -j REDIRECT --to-ports 8080
          -A PREROUTING -i {{ public_iface }} -p tcp --dport 443 -j REDIRECT --to-ports 8443
          COMMIT

    - name: Add CamBot redirected port filters to UFW before.rules
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        insertbefore: "^COMMIT$"
        marker: "# {mark} CAMBOT REDIRECT FILTERS"
        block: |
          -A ufw-before-input -p tcp --dport 8080 -j ACCEPT
          -A ufw-before-input -p tcp --dport 8443 -j ACCEPT

    - name: Dry-run validate UFW configuration
      ansible.builtin.command:
        argv:
          - ufw
          - --dry-run
          - reload
      changed_when: false

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"

    - name: Disable password SSH authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"

    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
