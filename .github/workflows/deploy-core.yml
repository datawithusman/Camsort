name: Deploy CamBot Core

on:
  workflow_call:
    inputs:
      cambot_environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.cambot_environment }}

    env:
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      HOST: ${{ secrets.HOST }}
      DEPLOY_USER: ${{ secrets.USER }}
      CAMBOT_ENVIRONMENT: ${{ inputs.cambot_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_DIR" ]; then
            echo "DEPLOY_DIR is missing."
            exit 1
          fi

          if [ -z "$HOST" ]; then
            echo "HOST is missing."
            exit 1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "USER is missing."
            exit 1
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "SSH_KEY is missing."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/cambot_deploy_key
          chmod 600 ~/.ssh/cambot_deploy_key

          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync project files
        run: |
          set -euo pipefail

          rsync -az --delete \
            --rsync-path="sudo rsync" \
            --chown=cambot:cambot \
            --no-owner \
            --no-group \
            -e "ssh -i ~/.ssh/cambot_deploy_key -o StrictHostKeyChecking=yes" \
            --exclude ".git" \
            --exclude "secrets" \
            --exclude "generated" \
            --exclude "generated_dtos" \
            --exclude "build" \
            --exclude "node_modules" \
            --exclude "__pycache__" \
            --exclude "infra/terraform/.terraform" \
            --exclude "infra/terraform/terraform.tfstate" \
            --exclude "infra/terraform/terraform.tfstate.backup" \
            --exclude "apps/client/config/env.js" \
            ./ "$DEPLOY_USER@$HOST:$DEPLOY_DIR/"

      - name: Restart CamBot pod
        run: |
          set -euo pipefail

          if [ -z "${CAMBOT_ENVIRONMENT:-}" ]; then
            echo "CAMBOT_ENVIRONMENT is missing."
            exit 1
          fi

          echo "Deploying CamBot environment: $CAMBOT_ENVIRONMENT"

          ssh -i ~/.ssh/cambot_deploy_key "$DEPLOY_USER@$HOST" \
            "sudo -H -u cambot env ENVIRONMENT='$CAMBOT_ENVIRONMENT' CAM_BOT_BASE_DIR='$DEPLOY_DIR' XDG_RUNTIME_DIR=/run/user/\$(id -u cambot) bash -lc 'echo Remote ENVIRONMENT=\$ENVIRONMENT; echo Remote CAM_BOT_BASE_DIR=\$CAM_BOT_BASE_DIR; cd \"\$CAM_BOT_BASE_DIR/infra/pod\" && ./podman-run.sh'"
