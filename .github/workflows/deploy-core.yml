name: Deploy CamBot Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    env:
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      HOST: ${{ secrets.HOST }}
      DEPLOY_USER: ${{ secrets.USER }}
      CAMBOT_ENVIRONMENT: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_DIR" ]; then
            echo "DEPLOY_DIR is missing."
            exit 1
          fi

          if [ -z "$HOST" ]; then
            echo "HOST is missing."
            exit 1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "USER is missing."
            exit 1
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "SSH_KEY is missing."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/cambot_deploy_key
          chmod 600 ~/.ssh/cambot_deploy_key

          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync project files
        run: |
          set -euo pipefail
        rsync -az --delete \
          --rsync-path="sudo rsync" \
          --chown=cambot:cambot \
          --no-owner \
          --no-group \
          -e "ssh -i ~/.ssh/cambot_deploy_key -o StrictHostKeyChecking=yes" \
          --exclude ".git" \
          --exclude "secrets" \
          --exclude "generated" \
          --exclude "generated_dtos" \
          --exclude "build" \
          --exclude "node_modules" \
          --exclude "__pycache__" \
          --exclude "infra/terraform/.terraform" \
          --exclude "infra/terraform/terraform.tfstate" \
          --exclude "infra/terraform/terraform.tfstate.backup" \
          ./ "$DEPLOY_USER@$HOST:$DEPLOY_DIR/"

      - name: Restart CamBot pod
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/cambot_deploy_key "$DEPLOY_USER@$HOST" \
            "cd '$DEPLOY_DIR/infra/pod' && ENVIRONMENT='$CAMBOT_ENVIRONMENT' CAM_BOT_BASE_DIR='$DEPLOY_DIR' sudo -u cambot XDG_RUNTIME_DIR=/run/user/\$(id -u cambot) podman-compose up -d --build"
