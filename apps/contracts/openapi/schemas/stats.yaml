components:
  schemas:
    Stats:
      type: object
      required:
        - operatorActionsOpen
        - operatorActionsAcknowledged
        - operatorActionsResolved
        - operatorActionsDismissed
        - workerRunsToday
        - geminiCallsToday
      properties:
        operatorActionsOpen:
          type: integer
        operatorActionsAcknowledged:
          type: integer
        operatorActionsResolved:
          type: integer
        operatorActionsDismissed:
          type: integer
        workerRunsToday:
          type: integer
        geminiCallsToday:
          type: integer
        skippedRunsDueToRateLimitToday:
          type: integer
        lastWorkerRunAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessfulWorkerRunAt:
          type: string
          format: date-time
          nullable: true
