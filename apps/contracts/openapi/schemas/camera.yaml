components:
  schemas:
    Camera:
      type: object
      required: [id, name, location, status, snapshotUrl]
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        status:
          type: string
          enum: [active, inactive]
        snapshotUrl:
          type: string
        tags:
          type: array
          items:
            type: string
