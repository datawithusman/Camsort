components:
  schemas:
    OperatorAction:
      type: object
      required:
        - id
        - cameraId
        - rank
        - score
        - severity
        - classification
        - reason
        - recommendedAction
        - operatorPriority
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        cameraId:
          type: string
        promptId:
          type: string
          nullable: true
        sortRunId:
          type: string
          nullable: true
        rank:
          type: integer
        score:
          type: number
        severity:
          type: string
          enum: [low, medium, high, critical]
        classification:
          type: string
        reason:
          type: string
        recommendedAction:
          type: string
        operatorPriority:
          type: string
          enum: [low, normal, urgent, immediate]
        status:
          type: string
          enum: [open, acknowledged, resolved, dismissed]
        snapshotUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateOperatorActionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, acknowledged, resolved, dismissed]
        operatorNote:
          type: string
          nullable: true
