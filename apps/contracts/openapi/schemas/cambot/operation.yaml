components:
  schemas:
    OperationTrigger:
      type: string
      enum:
        - manual
        - scheduled

    OperationStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled

    OperationEstimateRequest:
      type: object
      required:
        - promptId
        - cameraGroupId
      properties:
        promptId:
          type: string
        cameraGroupId:
          type: string

    OperationEstimate:
      type: object
      required:
        - allowed
        - estimatedCameraCount
        - estimatedGeminiCalls
        - estimatedCost
      properties:
        allowed:
          type: boolean
        restrictionReason:
          type: string
          nullable: true
        estimatedCameraCount:
          type: integer
        estimatedGeminiCalls:
          type: integer
        estimatedTokenCount:
          type: integer
        estimatedCost:
          type: number
          format: double

    CreateOperationRequest:
      type: object
      required:
        - promptId
        - cameraGroupId
      properties:
        promptId:
          type: string
        cameraGroupId:
          type: string
        trigger:
          $ref: "#/components/schemas/OperationTrigger"
        promptBindingId:
          type: string
          nullable: true
          description: Set for operations created from a scheduled prompt binding.

    Operation:
      type: object
      required:
        - id
        - promptId
        - cameraGroupId
        - trigger
        - status
        - totalCameras
        - processedCameras
        - matchedCameras
      properties:
        id:
          type: string
          example: operation-001
        promptId:
          type: string
        cameraGroupId:
          type: string
        promptBindingId:
          type: string
          nullable: true
        trigger:
          $ref: "#/components/schemas/OperationTrigger"
        status:
          $ref: "#/components/schemas/OperationStatus"
        totalCameras:
          type: integer
          example: 50
        processedCameras:
          type: integer
          example: 12
        matchedCameras:
          type: integer
          example: 3
        estimatedGeminiCalls:
          type: integer
          nullable: true
        estimatedCost:
          type: number
          format: double
          nullable: true
        actualGeminiCalls:
          type: integer
          nullable: true
        actualCost:
          type: number
          format: double
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    OperationListResponse:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"

    OperationResult:
      type: object
      required:
        - id
        - operationId
        - cameraId
        - frameRefId
        - frameUrl
        - include
        - promptMatchScore
        - operatorPriorityScore
        - recommendedAction
        - reason
      properties:
        id:
          type: string
          example: result-001
        operationId:
          type: string
        cameraId:
          type: string
          example: cam01
        cameraGroupId:
          type: string
          nullable: true
        promptId:
          type: string
          nullable: true
        frameRefId:
          type: string
          example: frame-ref-abc
        frameUrl:
          type: string
          example: /camera-system/cameras/cam01/frames/frame-cam01-00000001-idx-000000/image
        include:
          type: boolean
          description: True when the result should appear in the prompt result camera list.
        promptMatchScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Score from 0 to 100 indicating how strongly the snapshot matches the prompt.
        operatorPriorityScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Score from 0 to 100 indicating how urgently an operator should handle this recommended action.
        recommendedAction:
          type: string
          example: Send maintenance to salt the entrance walkway.
        reason:
          type: string
          example: The snapshot appears to show a slick surface near the doorway.
        rawModelJson:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    OperationResultListResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OperationResult"
