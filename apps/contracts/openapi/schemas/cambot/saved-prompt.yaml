components:
  schemas:
    SavedPrompt:
      type: object
      required:
        - id
        - name
        - promptText
        - enabled
      properties:
        id:
          type: string
          example: prompt-ice-near-entrances
        name:
          type: string
          example: Ice near entrances
        description:
          type: string
          nullable: true
          example: Checks entrance snapshots for ice, snow, slick surfaces, or blocked paths.
        promptText:
          type: string
          example: Inspect this camera snapshot for ice, snow, slick surfaces, blocked entrances, or other conditions that require staff action. Return structured JSON only.
        enabled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSavedPromptRequest:
      type: object
      required:
        - name
        - promptText
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        promptText:
          type: string
        enabled:
          type: boolean
          default: true

    UpdateSavedPromptRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        promptText:
          type: string
        enabled:
          type: boolean

    SavedPromptListResponse:
      type: object
      required:
        - prompts
      properties:
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/SavedPrompt"
