components:
  schemas:
    GeminiCallerSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
        modelName:
          type: string
          example: gemini-1.5-flash
        continuousScanEnabled:
          type: boolean
          example: true
          description: Enables the global continuous scan cycle. When enabled, all enabled prompt bindings are scanned every continuousScanIntervalSeconds.
        continuousScanIntervalSeconds:
          type: integer
          minimum: 30
          example: 900
          description: Global interval between continuous scan cycles. Each cycle runs all enabled prompt bindings.
        lastContinuousScanAt:
          type: string
          format: date-time
          nullable: true
          description: Last time a global continuous scan cycle was started or completed.
        nextContinuousScanAt:
          type: string
          format: date-time
          nullable: true
          description: Next time the worker should start a global continuous scan cycle.
        geminiCallDelayMs:
          type: integer
          minimum: 0
          example: 2000
          description: Global delay between individual Gemini calls used by the background scan worker for rate limiting.
        maxConcurrentGeminiCalls:
          type: integer
          minimum: 1
          example: 1
        maxTokensPerRequest:
          type: integer
          example: 8192
        maxCostPerDay:
          type: number
          format: double
          example: 25.0
        maxCostPerMonth:
          type: number
          format: double
          example: 300.0
        allowEmergencyOverride:
          type: boolean
          example: true
        updatedAt:
          type: string
          format: date-time

    UpdateGeminiCallerSettingsRequest:
      type: object
      properties:
        enabled:
          type: boolean
        modelName:
          type: string
        continuousScanEnabled:
          type: boolean
        continuousScanIntervalSeconds:
          type: integer
          minimum: 30
        lastContinuousScanAt:
          type: string
          format: date-time
          nullable: true
        nextContinuousScanAt:
          type: string
          format: date-time
          nullable: true
        geminiCallDelayMs:
          type: integer
          minimum: 0
        maxConcurrentGeminiCalls:
          type: integer
          minimum: 1
        maxTokensPerRequest:
          type: integer
        maxCostPerDay:
          type: number
          format: double
        maxCostPerMonth:
          type: number
          format: double
        allowEmergencyOverride:
          type: boolean

    UsageLimitSettings:
      type: object
      properties:
        maxScansPerDay:
          type: integer
          example: 500
        maxScansPerMonth:
          type: integer
          example: 10000
        maxEstimatedCostPerDay:
          type: number
          format: double
          example: 25.0
        maxEstimatedCostPerMonth:
          type: number
          format: double
          example: 300.0
        blockOperationsWhenLimitReached:
          type: boolean
          example: true
        updatedAt:
          type: string
          format: date-time

    UpdateUsageLimitSettingsRequest:
      type: object
      properties:
        maxScansPerDay:
          type: integer
        maxScansPerMonth:
          type: integer
        maxEstimatedCostPerDay:
          type: number
          format: double
        maxEstimatedCostPerMonth:
          type: number
          format: double
        blockOperationsWhenLimitReached:
          type: boolean
