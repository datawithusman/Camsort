components:
  schemas:
    PromptBinding:
      type: object
      required:
        - id
        - cameraGroupId
        - promptId
        - enabled
      properties:
        id:
          type: string
          example: binding-main-entrances-ice
        cameraGroupId:
          type: string
          example: group-main-entrances
        promptId:
          type: string
          example: prompt-ice-near-entrances
        enabled:
          type: boolean
          example: true
          description: When true, this prompt/camera-group pair participates in the global continuous scan cycle and can also be run manually.
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          description: Last time this prompt binding was executed by a manual or scheduled operation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePromptBindingRequest:
      type: object
      required:
        - promptId
      properties:
        promptId:
          type: string
        enabled:
          type: boolean
          default: true
          description: When true, the binding participates in global continuous scan cycles.

    UpdatePromptBindingRequest:
      type: object
      properties:
        enabled:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
          nullable: true

    PromptBindingListResponse:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/PromptBinding"
