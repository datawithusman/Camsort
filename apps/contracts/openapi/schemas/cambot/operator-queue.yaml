components:
  schemas:
    OperatorQueueStatus:
      type: string
      enum:
        - queued
        - acknowledged
        - dismissed
        - completed

    OperatorQueueItem:
      type: object
      required:
        - id
        - operationResultId
        - operationId
        - cameraId
        - frameRefId
        - frameUrl
        - recommendedAction
        - reason
        - promptMatchScore
        - operatorPriorityScore
        - status
      properties:
        id:
          type: string
        operationResultId:
          type: string
        operationId:
          type: string
        cameraId:
          type: string
        cameraGroupId:
          type: string
          nullable: true
        promptId:
          type: string
          nullable: true
        frameRefId:
          type: string
        frameUrl:
          type: string
        recommendedAction:
          type: string
        reason:
          type: string
        promptMatchScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
        operatorPriorityScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
        status:
          $ref: "#/components/schemas/OperatorQueueStatus"
        operatorNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOperatorQueueItemRequest:
      type: object
      required:
        - operationResultId
      properties:
        operationResultId:
          type: string
          description: Creates a queue item from a stored Gemini operation result.

    UpdateOperatorQueueItemRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/OperatorQueueStatus"
        operatorNote:
          type: string
          nullable: true

    OperatorQueueListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperatorQueueItem"
