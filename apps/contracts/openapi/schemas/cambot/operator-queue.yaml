components:
  schemas:
    OperatorQueueStatus:
      type: string
      enum:
        - queued
        - acknowledged
        - dismissed
        - completed

    OperatorQueueItem:
      type: object
      required:
        - id
        - secondPassResultId
        - operationId
        - cameraId
        - frameRefId
        - frameUrl
        - promptScore
        - operatorPriorityScore
        - operatorAction
        - reason
        - status
      properties:
        id:
          type: string
        secondPassResultId:
          type: string
        operationId:
          type: string
        cameraId:
          type: string
        cameraGroupId:
          type: string
          nullable: true
        promptId:
          type: string
          nullable: true
        frameRefId:
          type: string
        frameUrl:
          type: string
        promptScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Final global prompt score from the second pass.
        operatorPriorityScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
        operatorAction:
          type: string
        reason:
          type: string
        status:
          $ref: "#/components/schemas/OperatorQueueStatus"
        operatorNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOperatorQueueItemRequest:
      type: object
      required:
        - secondPassResultId
      properties:
        secondPassResultId:
          type: string
          description: Creates a queue item from a stored second-pass/global prompt result.

    UpdateOperatorQueueItemRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/OperatorQueueStatus"
        operatorNote:
          type: string
          nullable: true

    OperatorQueueListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperatorQueueItem"
