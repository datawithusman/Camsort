openapi: 3.1.0

info:
  title: CamBot REST API
  version: 0.1.0
  description: Product API used by the CamBot client.

servers:
  - url: /api
    description: Reverse-proxied CamBot API root

security:
  - basicAuth: []

tags:
  - name: Camera Groups
  - name: Saved Prompts
  - name: Prompt Bindings
  - name: Operations
  - name: Operator Queue
  - name: Settings
  - name: Usage
  - name: Camera System Proxy

paths:
  /camera-groups:
    get:
      tags: [Camera Groups]
      summary: List CamBot camera groups
      operationId: listCameraGroups
      responses:
        "200":
          description: Camera groups returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CameraGroupListResponse"

    post:
      tags: [Camera Groups]
      summary: Create a CamBot camera group
      operationId: createCameraGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CreateCameraGroupRequest"
      responses:
        "201":
          description: Camera group created
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CameraGroup"

  /camera-groups/{groupId}:
    get:
      tags: [Camera Groups]
      summary: Get a CamBot camera group
      operationId: getCameraGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Camera group returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CameraGroup"

    put:
      tags: [Camera Groups]
      summary: Update a CamBot camera group
      operationId: updateCameraGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/UpdateCameraGroupRequest"
      responses:
        "200":
          description: Camera group updated
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CameraGroup"

    delete:
      tags: [Camera Groups]
      summary: Delete a CamBot camera group
      operationId: deleteCameraGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Camera group deleted

  /camera-groups/{groupId}/cameras:
    put:
      tags: [Camera Groups]
      summary: Replace cameras assigned to a CamBot camera group
      operationId: replaceCameraGroupCameras
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/ReplaceCameraGroupCamerasRequest"
      responses:
        "200":
          description: Camera group cameras replaced
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CameraGroup"

  /camera-groups/{groupId}/stats:
    get:
      tags: [Camera Groups]
      summary: Get camera group statistics
      operationId: getCameraGroupStats
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Camera group statistics returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CameraGroupStats"

  /saved-prompts:
    get:
      tags: [Saved Prompts]
      summary: List saved prompts
      operationId: listSavedPrompts
      responses:
        "200":
          description: Saved prompts returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/saved-prompt.yaml#/components/schemas/SavedPromptListResponse"

    post:
      tags: [Saved Prompts]
      summary: Create a saved prompt
      operationId: createSavedPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/saved-prompt.yaml#/components/schemas/CreateSavedPromptRequest"
      responses:
        "201":
          description: Saved prompt created
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/saved-prompt.yaml#/components/schemas/SavedPrompt"

  /saved-prompts/{promptId}:
    get:
      tags: [Saved Prompts]
      summary: Get a saved prompt
      operationId: getSavedPrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
      responses:
        "200":
          description: Saved prompt returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/saved-prompt.yaml#/components/schemas/SavedPrompt"

    put:
      tags: [Saved Prompts]
      summary: Update a saved prompt
      operationId: updateSavedPrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/saved-prompt.yaml#/components/schemas/UpdateSavedPromptRequest"
      responses:
        "200":
          description: Saved prompt updated
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/saved-prompt.yaml#/components/schemas/SavedPrompt"

    delete:
      tags: [Saved Prompts]
      summary: Delete a saved prompt
      operationId: deleteSavedPrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
      responses:
        "204":
          description: Saved prompt deleted

  /saved-prompts/{promptId}/camera-groups:
    get:
      tags: [Saved Prompts]
      summary: List camera groups used by a saved prompt
      description: Returns the camera groups that are currently bound to the saved prompt. By default disabled prompt bindings are excluded.
      operationId: listSavedPromptCameraGroups
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - name: includeDisabled
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include camera groups where the prompt binding exists but is disabled.
      responses:
        "200":
          description: Camera groups used by the saved prompt returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/camera-group.yaml#/components/schemas/CameraGroupListResponse"

  /camera-groups/{groupId}/prompt-bindings:
    get:
      tags: [Prompt Bindings]
      summary: List saved prompts applied to a camera group
      operationId: listCameraGroupPromptBindings
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Prompt bindings returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/prompt-binding.yaml#/components/schemas/PromptBindingListResponse"

    post:
      tags: [Prompt Bindings]
      summary: Apply a saved prompt to a camera group
      operationId: createCameraGroupPromptBinding
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/prompt-binding.yaml#/components/schemas/CreatePromptBindingRequest"
      responses:
        "201":
          description: Prompt binding created
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/prompt-binding.yaml#/components/schemas/PromptBinding"

  /camera-groups/{groupId}/prompt-bindings/{bindingId}:
    put:
      tags: [Prompt Bindings]
      summary: Update a prompt binding
      operationId: updateCameraGroupPromptBinding
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/BindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/prompt-binding.yaml#/components/schemas/UpdatePromptBindingRequest"
      responses:
        "200":
          description: Prompt binding updated
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/prompt-binding.yaml#/components/schemas/PromptBinding"

    delete:
      tags: [Prompt Bindings]
      summary: Remove prompt from camera group
      operationId: deleteCameraGroupPromptBinding
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/BindingId"
      responses:
        "204":
          description: Prompt binding deleted

  /operations/estimate:
    post:
      tags: [Operations]
      summary: Estimate prompt scan usage and cost
      operationId: estimateOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/operation.yaml#/components/schemas/OperationEstimateRequest"
      responses:
        "200":
          description: Operation estimate returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/OperationEstimate"

  /operations:
    get:
      tags: [Operations]
      summary: List prompt scan operations
      operationId: listOperations
      parameters:
        - name: promptId
          in: query
          required: false
          schema:
            type: string
        - name: cameraGroupId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "./schemas/cambot/operation.yaml#/components/schemas/OperationStatus"
      responses:
        "200":
          description: Operations returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/OperationListResponse"

    post:
      tags: [Operations]
      summary: Create a prompt scan operation
      operationId: createOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/operation.yaml#/components/schemas/CreateOperationRequest"
      responses:
        "201":
          description: Operation created
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/Operation"

  /operations/{operationId}:
    get:
      tags: [Operations]
      summary: Get a prompt scan operation
      operationId: getOperation
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/Operation"

  /operations/{operationId}/first-pass-results:
    get:
      tags: [Operations]
      summary: List first-pass image results for an operation
      operationId: listOperationFirstPassResults
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: First-pass results returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/FirstPassResultListResponse"

  /operations/{operationId}/second-pass-results:
    get:
      tags: [Operations]
      summary: List second-pass global prompt results for an operation
      operationId: listOperationSecondPassResults
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Second-pass results returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/SecondPassResultListResponse"

  /prompt-results/latest/first-pass:
    get:
      tags: [Operations]
      summary: List latest first-pass results for a prompt and camera group
      operationId: listLatestFirstPassResults
      parameters:
        - name: promptId
          in: query
          required: true
          schema:
            type: string
        - name: cameraGroupId
          in: query
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Latest first-pass results returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/LatestFirstPassResultListResponse"

  /prompt-results/latest/second-pass:
    get:
      tags: [Operations]
      summary: List latest second-pass global results for a prompt and camera group
      operationId: listLatestSecondPassResults
      parameters:
        - name: promptId
          in: query
          required: true
          schema:
            type: string
        - name: cameraGroupId
          in: query
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Latest second-pass results returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operation.yaml#/components/schemas/LatestSecondPassResultListResponse"

  /operator-queue:
    get:
      tags: [Operator Queue]
      summary: List operator queue items
      operationId: listOperatorQueueItems
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "./schemas/cambot/operator-queue.yaml#/components/schemas/OperatorQueueStatus"
      responses:
        "200":
          description: Operator queue returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operator-queue.yaml#/components/schemas/OperatorQueueListResponse"

    post:
      tags: [Operator Queue]
      summary: Create an operator queue item from a second-pass result
      operationId: createOperatorQueueItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/operator-queue.yaml#/components/schemas/CreateOperatorQueueItemRequest"
      responses:
        "201":
          description: Queue item created
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operator-queue.yaml#/components/schemas/OperatorQueueItem"

  /operator-queue/{queueItemId}:
    put:
      tags: [Operator Queue]
      summary: Update operator queue item status
      operationId: updateOperatorQueueItem
      parameters:
        - name: queueItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/operator-queue.yaml#/components/schemas/UpdateOperatorQueueItemRequest"
      responses:
        "200":
          description: Queue item updated
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/operator-queue.yaml#/components/schemas/OperatorQueueItem"

  /settings/gemini:
    get:
      tags: [Settings]
      summary: Get Gemini caller settings
      operationId: getGeminiCallerSettings
      responses:
        "200":
          description: Gemini caller settings returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/settings.yaml#/components/schemas/GeminiCallerSettings"

    put:
      tags: [Settings]
      summary: Update Gemini caller settings
      operationId: updateGeminiCallerSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/settings.yaml#/components/schemas/UpdateGeminiCallerSettingsRequest"
      responses:
        "200":
          description: Gemini caller settings updated
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/settings.yaml#/components/schemas/GeminiCallerSettings"

  /settings/usage-limits:
    get:
      tags: [Settings]
      summary: Get usage limit settings
      operationId: getUsageLimitSettings
      responses:
        "200":
          description: Usage limit settings returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/settings.yaml#/components/schemas/UsageLimitSettings"

    put:
      tags: [Settings]
      summary: Update usage limit settings
      operationId: updateUsageLimitSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cambot/settings.yaml#/components/schemas/UpdateUsageLimitSettingsRequest"
      responses:
        "200":
          description: Usage limit settings updated
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/settings.yaml#/components/schemas/UsageLimitSettings"

  /usage/summary:
    get:
      tags: [Usage]
      summary: Get usage and estimated cost summary
      operationId: getUsageSummary
      responses:
        "200":
          description: Usage summary returned
          content:
            application/json:
              schema:
                $ref: "./schemas/cambot/usage.yaml#/components/schemas/UsageSummary"

  /camera-system/status:
    get:
      tags: [Camera System Proxy]
      summary: Proxy camera system status
      operationId: getProxiedCameraSystemStatus
      responses:
        "200":
          description: Camera system status returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/system-status.yaml#/components/schemas/SystemStatus"

  /camera-system/cameras:
    get:
      tags: [Camera System Proxy]
      summary: Proxy source camera list
      operationId: listProxiedIntegratorCameras
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Cameras returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/camera.yaml#/components/schemas/CameraListResponse"

  /camera-system/cameras/{cameraId}:
    get:
      tags: [Camera System Proxy]
      summary: Proxy source camera details
      operationId: getProxiedIntegratorCamera
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: Camera returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/camera.yaml#/components/schemas/Camera"

  /camera-system/cameras/{cameraId}/snapshot:
    get:
      tags: [Camera System Proxy]
      summary: Proxy camera snapshot metadata
      operationId: getProxiedCameraSnapshot
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: Snapshot frame metadata returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/snapshot.yaml#/components/schemas/CameraSnapshot"

  /camera-system/cameras/{cameraId}/frames/{frameId}/url:
    get:
      tags: [Camera System Proxy]
      summary: Proxy camera frame URL
      operationId: getProxiedCameraFrameUrl
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - $ref: "#/components/parameters/FrameId"
      responses:
        "200":
          description: Frame URL returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/snapshot.yaml#/components/schemas/CameraFrameUrlResponse"

  /camera-system/cameras/{cameraId}/frames/{frameId}/image:
    get:
      tags: [Camera System Proxy]
      summary: Proxy camera frame image bytes
      operationId: getProxiedCameraFrameImage
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - $ref: "#/components/parameters/FrameId"
      responses:
        "200":
          description: Frame image bytes returned
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary

  /camera-system/cameras/{cameraId}/stream:
    get:
      tags: [Camera System Proxy]
      summary: Proxy camera stream descriptor
      operationId: getProxiedCameraStream
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: Stream descriptor returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/stream.yaml#/components/schemas/CameraStream"

  /camera-system/source-camera-groups:
    get:
      tags: [Camera System Proxy]
      summary: Proxy source camera group list
      operationId: listProxiedIntegratorCameraGroups
      responses:
        "200":
          description: Source camera groups returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/camera-group.yaml#/components/schemas/CameraSystemGroupListResponse"

  /camera-system/source-camera-groups/{groupId}:
    get:
      tags: [Camera System Proxy]
      summary: Proxy source camera group details
      operationId: getProxiedIntegratorCameraGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Source camera group returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/camera-group.yaml#/components/schemas/CameraSystemGroup"

  /camera-system/source-camera-groups/{groupId}/cameras:
    get:
      tags: [Camera System Proxy]
      summary: Proxy source cameras in a group
      operationId: listProxiedIntegratorCameraGroupCameras
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Cameras returned
          content:
            application/json:
              schema:
                $ref: "./schemas/camera-system-integrator/camera.yaml#/components/schemas/CameraListResponse"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using the operator username and password. Send credentials with the Authorization header.

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string

    PromptId:
      name: promptId
      in: path
      required: true
      schema:
        type: string


    CameraId:
      name: cameraId
      in: path
      required: true
      schema:
        type: string

    FrameId:
      name: frameId
      in: path
      required: true
      schema:
        type: string

    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
