<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CamBot Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">CamBot V1</p>
      <h1>Visual operations agent for operator actions</h1>
      <p>CamBot uses Gemini multimodal reasoning to turn camera snapshots into a prioritized operator action queue.</p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Operator Action Queue</h2>
        <button id="refreshBtn">Refresh</button>
      </div>
      <div id="stats" class="stats">Loading stats...</div>
      <div id="actions" class="grid">Loading actions...</div>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
