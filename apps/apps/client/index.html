<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CamBot</title><link rel="stylesheet" href="styles.css"></head><body><main id="app"><section id="login" class="panel login"><h1>CamBot</h1><p>Enter dev Basic Auth credentials.</p><input id="username" placeholder="username"><input id="password" type="password" placeholder="password"><button id="loginBtn">Login</button><p id="loginMsg" class="muted"></p></section><section id="dashboard" hidden><header><h1>CamBot Dashboard</h1><button id="logoutBtn">Logout</button></header><section class="panel"><div class="row-title"><h2>Prompt Library</h2><button id="newPromptBtn">+ Prompt</button></div><div class="grid two"><div><label>Name</label><input id="promptName"><label>Prompt Text</label><textarea id="promptText"></textarea><button id="savePromptBtn">Save Prompt</button></div><div><label>Prompt</label><select id="promptSelect"></select><label>Camera Group</label><select id="groupSelect"></select><div class="actions"><button id="runBtn">Run Single Scan</button><button id="bindBtn">Enable Continuous Scan Binding</button></div><p class="muted">Continuous scan interval is global in settings.</p></div></div><div id="promptList" class="list"></div></section><section class="panel"><div class="row-title"><h2>Prompt Result Viewer</h2><button id="refreshResultsBtn">Refresh Results</button></div><div id="resultList" class="cards"></div></section><section class="panel"><div class="row-title"><h2>Operator Action Queue</h2><button id="refreshQueueBtn">Refresh Queue</button></div><div id="queueList" class="list"></div></section><section class="panel"><h2>Global Settings</h2><div class="grid four"><label>Continuous Scan Enabled <input id="continuousEnabled" type="checkbox"></label><label>Continuous Interval Seconds <input id="continuousInterval" type="number"></label><label>Gemini Call Delay Ms <input id="geminiDelay" type="number"></label><label>Max Cost/Day <input id="maxCostDay" type="number" step="0.01"></label></div><button id="saveSettingsBtn">Save Settings</button><pre id="usageSummary"></pre></section></section></main><script src="main.js"></script></body></html>
